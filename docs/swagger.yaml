swagger: "2.0"
info:
  title: PVZ Service API
  description: API для управления пунктами выдачи заказов (ПВЗ)
  version: "1.0.0"
  contact:
    name: API Support
    email: support@example.com

definitions:
  handlers.loginRequest:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        format: email
        description: Email пользователя
      password:
        type: string
        format: password
        description: Пароль пользователя

  handlers.registerRequest:
    type: object
    required:
      - email
      - password
      - role
    properties:
      email:
        type: string
        format: email
        description: Email пользователя
      password:
        type: string
        format: password
        description: Пароль пользователя
      role:
        type: string
        enum: [employee, moderator]
        description: Роль пользователя

  models.User:
    type: object
    properties:
      id:
        type: string
        format: uuid
        description: Уникальный идентификатор пользователя
      email:
        type: string
        format: email
        description: Email пользователя
      role:
        type: string
        enum: [employee, moderator]
        description: Роль пользователя

  models.PVZ:
    type: object
    required:
      - city
    properties:
      id:
        type: string
        format: uuid
        description: Уникальный идентификатор ПВЗ
      city:
        type: string
        description: Город, в котором находится ПВЗ
      registrationDate:
        type: string
        format: date-time
        description: Дата регистрации ПВЗ

  models.Intake:
    type: object
    required:
      - pvzId
      - status
    properties:
      id:
        type: string
        format: uuid
        description: Уникальный идентификатор приемки
      pvzId:
        type: string
        format: uuid
        description: ID ПВЗ, к которому относится приемка
      status:
        type: string
        enum: [pending, completed, cancelled]
        description: Статус приемки
      DateTime:
        type: string
        format: date-time
        description: Дата и время приемки

  models.Product:
    type: object
    required:
      - name
      - quantity
    properties:
      id:
        type: string
        format: uuid
        description: Уникальный идентификатор товара
      name:
        type: string
        description: Наименование товара
      quantity:
        type: integer
        description: Количество товара

securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: JWT токен для аутентификации

paths:
  /dummyLogin:
    post:
      tags:
        - auth
      summary: Получение тестового токена
      description: Получение тестового токена для разработки
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            type: object
            properties:
              role:
                type: string
                enum: [employee, moderator]
                description: Роль пользователя
      responses:
        "200":
          description: Успешное получение токена
          schema:
            type: string
        "400":
          description: Ошибка в запросе
          schema:
            type: object
            additionalProperties:
              type: string

  /login:
    post:
      tags:
        - auth
      summary: Авторизация пользователя
      description: Аутентификация пользователя и получение JWT токена
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/handlers.loginRequest'
      responses:
        "200":
          description: Успешная авторизация
          schema:
            type: string
        "401":
          description: Неверные учетные данные
          schema:
            type: object
            additionalProperties:
              type: string

  /register:
    post:
      tags:
        - auth
      summary: Регистрация пользователя
      description: Создание нового пользователя с email, паролем и ролью
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/handlers.registerRequest'
      responses:
        "201":
          description: Пользователь успешно создан
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Ошибка в запросе
          schema:
            type: object
            additionalProperties:
              type: string

  /pvz:
    post:
      tags:
        - pvz
      summary: Создание ПВЗ
      description: Создание нового пункта выдачи заказов (только для модераторов)
      security:
        - bearerAuth: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/models.PVZ'
      responses:
        "201":
          description: ПВЗ успешно создан
          schema:
            $ref: '#/definitions/models.PVZ'
        "400":
          description: Ошибка в запросе
          schema:
            type: object
            additionalProperties:
              type: string
        "403":
          description: Доступ запрещен
          schema:
            type: object
            additionalProperties:
              type: string

  /pvz/{id}:
    get:
      tags:
        - pvz
      summary: Получение ПВЗ по ID
      description: Получение информации о пункте выдачи заказов по его ID
      security:
        - bearerAuth: []
      produces:
        - application/json
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
          description: ID ПВЗ
      responses:
        "200":
          description: Успешное получение информации о ПВЗ
          schema:
            $ref: '#/definitions/models.PVZ'
        "404":
          description: ПВЗ не найден
          schema:
            type: object
            additionalProperties:
              type: string

  /receptions:
    post:
      tags:
        - intake
      summary: Создание новой приемки товаров
      description: Создание новой приемки товаров (только для сотрудников ПВЗ)
      security:
        - bearerAuth: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/models.Intake'
      responses:
        "201":
          description: Приемка успешно создана
          schema:
            $ref: '#/definitions/models.Intake'
        "400":
          description: Ошибка в запросе
          schema:
            type: object
            additionalProperties:
              type: string
        "403":
          description: Доступ запрещен
          schema:
            type: object
            additionalProperties:
              type: string

  /products:
    post:
      tags:
        - products
      summary: Создание нового товара
      description: Создание нового товара в системе
      security:
        - bearerAuth: []
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/models.Product'
      responses:
        "201":
          description: Товар успешно создан
          schema:
            $ref: '#/definitions/models.Product'
        "400":
          description: Ошибка в запросе
          schema:
            type: object
            additionalProperties:
              type: string
        "403":
          description: Доступ запрещен
          schema:
            type: object
            additionalProperties:
              type: string

  /products/{id}:
    get:
      tags:
        - products
      summary: Получение товара по ID
      description: Получение информации о товаре по его ID
      security:
        - bearerAuth: []
      produces:
        - application/json
      parameters:
        - in: path
          name: id
          required: true
          type: string
          format: uuid
          description: ID товара
      responses:
        "200":
          description: Успешное получение информации о товаре
          schema:
            $ref: '#/definitions/models.Product'
        "404":
          description: Товар не найден
          schema:
            type: object
            additionalProperties:
              type: string
